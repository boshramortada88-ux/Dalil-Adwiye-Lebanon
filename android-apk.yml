name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DalilAdwiyeLebanon-source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q DalilAdwiyeLebanon-source.zip

      - name: Build APK
        run: |
          cd DalilAdwiyeLebanon
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dalil-Adwiye-Lebanon-APK
          path: DalilAdwiyeLebanon/app/build/outputs/apk/debug/app-debug.apk
